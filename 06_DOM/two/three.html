<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Element in DOM</title>
</head>

<body style="background-color: #212121; color: #fff;">


    <script>
        const div = document.createElement("div")
        console.log(div);

        div.className = "main"
        div.id = Math.round(Math.random() * 10 + 1)

        div.setAttribute("title", "generate title")
        // div.title = "generate title"

        div.style.backgroundColor = "green"
        div.style.padding = "12px"
        // Used div.style.cssText to set multiple CSS properties in a single line.
        // div.style.cssText = "background-color: green; padding: 12px;";



        // div.innerText = "Abu Bakkar Siddique"
        //innerText: its overwrite the text

        const addText = document.createTextNode("Abu Bakkar Siddique")
        div.appendChild(addText)

        //attached:
        document.body.appendChild(div)
    </script>
</body>

</html>
